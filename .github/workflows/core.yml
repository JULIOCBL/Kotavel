name: Core validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DKOTAVEL_BUILD_TESTS=ON
      - run: cmake --build build/ci --config ${{ matrix.build }} --parallel 2
      - run: ctest --test-dir build/ci -C ${{ matrix.build }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: >-
          cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -Wall -Wextra -Wpedantic"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - run: cmake --build build/sanitizers --parallel 2
      - run: ctest --test-dir build/sanitizers --output-on-failure
