name: Publish Conan binary cache

on:
  workflow_dispatch:
    inputs:
      with_http:
        description: Build and cache Kotavel's optional Drogon adapter
        type: boolean
        required: true
        default: false
      with_desktop:
        description: Build and cache Kotavel's optional Qt Quick adapter
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      max-parallel: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Conan remote configuration
        shell: bash
        env:
          REMOTE_URL: ${{ secrets.KOTAVEL_CONAN_REMOTE_URL }}
        run: |
          if [ -z "$REMOTE_URL" ]; then
            echo "Configure KOTAVEL_CONAN_REMOTE_URL before publishing binary packages." >&2
            exit 1
          fi
      - name: Prepare Kotavel toolchain
        run: |
          python -m pip install .
          kotavel prepare
      - name: Build and publish packages (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          REMOTE_URL: ${{ secrets.KOTAVEL_CONAN_REMOTE_URL }}
          REMOTE_USER: ${{ secrets.KOTAVEL_CONAN_REMOTE_USER }}
          REMOTE_PASSWORD: ${{ secrets.KOTAVEL_CONAN_REMOTE_PASSWORD }}
          WITH_HTTP: ${{ inputs.with_http }}
          WITH_DESKTOP: ${{ inputs.with_desktop }}
        run: |
          source .kotavel/tools/activate.sh
          conan remote add kotavel-binaries "$REMOTE_URL" --index 0 --force
          if [ -n "$REMOTE_USER" ] && [ -n "$REMOTE_PASSWORD" ]; then
            conan remote login kotavel-binaries "$REMOTE_USER" -p "$REMOTE_PASSWORD"
          fi
          conan create . --build=missing \
            -s:h build_type=Release -s:b build_type=Release \
            -o kotavel/*:with_http="$WITH_HTTP" \
            -o kotavel/*:with_desktop="$WITH_DESKTOP"
          # Each hosted runner has a fresh Conan cache; upload only this build's
          # resolved graph, including any dependency binaries built by Conan.
          conan upload '*' --remote=kotavel-binaries --confirm
      - name: Build and publish packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REMOTE_URL: ${{ secrets.KOTAVEL_CONAN_REMOTE_URL }}
          REMOTE_USER: ${{ secrets.KOTAVEL_CONAN_REMOTE_USER }}
          REMOTE_PASSWORD: ${{ secrets.KOTAVEL_CONAN_REMOTE_PASSWORD }}
          WITH_HTTP: ${{ inputs.with_http }}
          WITH_DESKTOP: ${{ inputs.with_desktop }}
        run: |
          . .\.kotavel\tools\activate.ps1
          conan remote add kotavel-binaries $env:REMOTE_URL --index 0 --force
          if ($env:REMOTE_USER -and $env:REMOTE_PASSWORD) {
            conan remote login kotavel-binaries $env:REMOTE_USER -p $env:REMOTE_PASSWORD
          }
          conan create . --build=missing `
            -s:h build_type=Release -s:b build_type=Release `
            -o kotavel/*:with_http=$env:WITH_HTTP `
            -o kotavel/*:with_desktop=$env:WITH_DESKTOP
          if ($LASTEXITCODE -ne 0) { throw 'Conan package build failed.' }
          conan upload '*' --remote=kotavel-binaries --confirm
          if ($LASTEXITCODE -ne 0) { throw 'Conan package upload failed.' }
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare Kotavel toolchain
        run: |
          python -m pip install .
          kotavel prepare
      - name: Install and compile from the binary remote (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          REMOTE_URL: ${{ secrets.KOTAVEL_CONAN_REMOTE_URL }}
          REMOTE_USER: ${{ secrets.KOTAVEL_CONAN_REMOTE_USER }}
          REMOTE_PASSWORD: ${{ secrets.KOTAVEL_CONAN_REMOTE_PASSWORD }}
          WITH_HTTP: ${{ inputs.with_http }}
          WITH_DESKTOP: ${{ inputs.with_desktop }}
        run: |
          source .kotavel/tools/activate.sh
          conan remote add kotavel-binaries "$REMOTE_URL" --index 0 --force
          if [ -n "$REMOTE_USER" ] && [ -n "$REMOTE_PASSWORD" ]; then
            conan remote login kotavel-binaries "$REMOTE_USER" -p "$REMOTE_PASSWORD"
          fi
          conan install tests/package_consumer --output-folder=build/package-consumer \
            --build=never --remote=kotavel-binaries \
            -s:h build_type=Release -s:b build_type=Release \
            -o kotavel/*:with_http="$WITH_HTTP" \
            -o kotavel/*:with_desktop="$WITH_DESKTOP"
          cmake -S tests/package_consumer -B build/package-consumer/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/package-consumer/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/package-consumer/build --config Release
      - name: Install and compile from the binary remote (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REMOTE_URL: ${{ secrets.KOTAVEL_CONAN_REMOTE_URL }}
          REMOTE_USER: ${{ secrets.KOTAVEL_CONAN_REMOTE_USER }}
          REMOTE_PASSWORD: ${{ secrets.KOTAVEL_CONAN_REMOTE_PASSWORD }}
          WITH_HTTP: ${{ inputs.with_http }}
          WITH_DESKTOP: ${{ inputs.with_desktop }}
        run: |
          . .\.kotavel\tools\activate.ps1
          conan remote add kotavel-binaries $env:REMOTE_URL --index 0 --force
          if ($env:REMOTE_USER -and $env:REMOTE_PASSWORD) {
            conan remote login kotavel-binaries $env:REMOTE_USER -p $env:REMOTE_PASSWORD
          }
          conan install tests/package_consumer --output-folder=build/package-consumer `
            --build=never --remote=kotavel-binaries `
            -s:h build_type=Release -s:b build_type=Release `
            -o kotavel/*:with_http=$env:WITH_HTTP `
            -o kotavel/*:with_desktop=$env:WITH_DESKTOP
          if ($LASTEXITCODE -ne 0) { throw 'Binary-only Conan install failed.' }
          $toolchain = (Resolve-Path build/package-consumer/conan_toolchain.cmake).Path
          cmake -S tests/package_consumer -B build/package-consumer/build -G Ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Consumer CMake configuration failed.' }
          cmake --build build/package-consumer/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Consumer build failed.' }
