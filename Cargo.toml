[workspace]
members = ["crates/core", "crates/platform"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
framework-core = { package = "core", path = "crates/core" }
platform = { path = "crates/platform" }
cxx = "1.0"
cxx-qt-build = "0.10"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
encoding_rs = "0.8"
getrandom = "0.3"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.35.2", default-features = false, features = ["system"] }
tempfile = "3"
url = "2"
