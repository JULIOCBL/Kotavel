[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotavel-tools"
version = "0.1.0"
description = "Herramientas de desarrollo multiplataforma de Kotavel"
requires-python = ">=3.9"
authors = [{ name = "Julio Cesar Borges Lopez" }]
license = { file = "LICENSE" }

[project.scripts]
kotavel = "kotavel_cli.cli:main"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
kotavel_cli = ["platform/*.sh", "platform/*.ps1", "templates/application/profiles/*"]
